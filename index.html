
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS5 Web Downloader</title>
<style>
body {
  background: #101522;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 30px 15px;
}
.container {
  max-width: 600px;
  margin: 50px auto;
  background: #202b40;
  padding: 25px;
  border-radius: 15px;
}
input {
  width: 90%;
  padding: 15px;
  border-radius: 8px;
  border: none;
  margin: 12px 0;
}
button {
  padding: 14px 25px;
  background: #1769ff;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}
p { color: #bdc9dc; }
</style>
</head>
<body>
<div class="container">
<h1>PS5 Web Downloader</h1>
<p>Gerenciador de links e downloads</p>

<input id="url" type="url"
placeholder="Cole aqui o link do arquivo">

<br>
<button onclick="downloadFile()">BAIXAR ARQUIVO</button>

<p id="status">Aguardando link...</p>
</div>

<script>
function downloadFile() {
  const url = document.getElementById("url").value;
  const status = document.getElementById("status");

  try {
    const link = new URL(url);

    if (link.protocol !== "https:" &&
        link.protocol !== "http:") {
      throw new Error();
    }

    status.textContent = "Abrindo link de download...";

    window.location.href = link.href;

  } catch (error) {
    status.textContent = "Digite um link válido.";
  }
}
</script>
</body>
</html>
